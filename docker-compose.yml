services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - springer

  backend:
    build:
      context: ./springer
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-springer-backend:latest}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,postgresql}
      SPRINGER_POSTGRES_URL: ${SPRINGER_POSTGRES_URL:?SPRINGER_POSTGRES_URL is required}
      SPRINGER_POSTGRES_USER: ${SPRINGER_POSTGRES_USER:?SPRINGER_POSTGRES_USER is required}
      SPRINGER_POSTGRES_PASSWORD: ${SPRINGER_POSTGRES_PASSWORD:?SPRINGER_POSTGRES_PASSWORD is required}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:?APP_FRONTEND_URL is required}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    networks:
      - springer

  frontend:
    build:
      context: ./springer_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    environment:
      BACKEND_URL: ${BACKEND_URL:?BACKEND_URL is required}
      FRONTEND_HOST: ${FRONTEND_HOST:?FRONTEND_HOST is required}
    image: ${FRONTEND_IMAGE:-springer-frontend:latest}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - springer

networks:
  springer:
    driver: bridge

volumes:
  postgres_data: