# Isolated PostgreSQL profile. Credentials must be supplied through environment variables.
spring.datasource.url=${SPRINGER_POSTGRES_URL:jdbc:postgresql://localhost:5432/springer_postgresql_migration_test}
spring.datasource.username=${SPRINGER_POSTGRES_USER:postgres}
spring.datasource.password=${SPRINGER_POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.locations=classpath:db/postgresql/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true